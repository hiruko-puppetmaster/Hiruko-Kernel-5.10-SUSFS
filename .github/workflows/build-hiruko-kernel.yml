name: Build Hiruko-puppetmaster-5.10.272 (SUSFS)

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: 'Custom Kernel Localversion'
        required: true
        default: '-Hiruko-puppetmaster'
      build_user:
        description: 'Kernel Build User'
        required: true
        default: 'Hiruko'
      build_host:
        description: 'Kernel Build Host'
        required: true
        default: 'puppetmaster'

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
      KERNEL_REF: android12-5.10-lts
      CLANG_DIR: ${{ github.workspace }}/toolchains/clang
      BUILD_ROOT: ${{ github.workspace }}

    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils-aarch64-linux-gnu bison build-essential \
            ccache cpio curl dwarves flex gcc-aarch64-linux-gnu git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 python3-pip rsync unzip wget zip

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-r416183b-${{ runner.os }}-arm64

      - name: Download AOSP Clang Toolchain (clang-r416183b)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$CLANG_DIR"
          if wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz" -O clang.tar.gz; then
            tar -xzf clang.tar.gz -C "$CLANG_DIR"
            rm -f clang.tar.gz
          else
            git clone --depth=1 --filter=blob:none --sparse -b master-kernel-build-2021 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
            cd clang-repo
            git sparse-checkout set clang-r416183b
            cp -r clang-r416183b/* "$CLANG_DIR/"
            cd ..
            rm -rf clang-repo
          fi
          "$CLANG_DIR/bin/clang" --version

      - name: Cache Kernel Source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel
          key: kernel-${{ env.KERNEL_REF }}-${{ runner.os }}-arm64

      - name: Prepare and Validate Android12-5.10-LTS Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          valid_kernel_tree() {
            [[ -f kernel/Makefile ]] &&
            [[ -f kernel/arch/arm64/Makefile ]] &&
            grep -qE '^VERSION[[:space:]]*=[[:space:]]*5([[:space:]]|$)' kernel/Makefile &&
            grep -qE '^PATCHLEVEL[[:space:]]*=[[:space:]]*10([[:space:]]|$)' kernel/Makefile
          }

          retry_clone() {
            local attempt
            for attempt in 1 2 3; do
              rm -rf kernel
              echo "Clone attempt $attempt of 3: $KERNEL_REPO_URL ($KERNEL_REF)"
              if git clone --depth=1 --single-branch --branch "$KERNEL_REF" \
                "$KERNEL_REPO_URL" kernel; then
                return 0
              fi
              echo "Clone attempt $attempt failed; retrying in $((attempt * 5)) seconds."
              rm -rf kernel
              sleep $((attempt * 5))
            done

            echo "ERROR: Failed to clone the kernel source after 3 attempts."
            return 1
          }

          retry_fetch() {
            local attempt
            for attempt in 1 2 3; do
              echo "Fetch attempt $attempt of 3: $KERNEL_REF"
              if git -C kernel fetch --depth=1 origin "$KERNEL_REF"; then
                git -C kernel checkout -B "$KERNEL_REF" FETCH_HEAD
                git -C kernel reset --hard FETCH_HEAD
                git -C kernel clean -fdx
                return 0
              fi
              echo "Fetch attempt $attempt failed; retrying in $((attempt * 5)) seconds."
              sleep $((attempt * 5))
            done

            return 1
          }

          if git -C kernel rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "Kernel cache checkout found."

            remote_url="$(git -C kernel remote get-url origin || true)"
            if [[ "$remote_url" == "$KERNEL_REPO_URL" || "$remote_url" == "${KERNEL_REPO_URL}.git" ]]; then
              echo "Refreshing cached checkout from $KERNEL_REF."
              git -C kernel reset --hard
              git -C kernel clean -fdx

              if ! retry_fetch; then
                echo "Could not refresh cached checkout; replacing it with a fresh clone."
                retry_clone
              fi
            else
              echo "Cached checkout has an unexpected origin: ${remote_url:-<missing>}"
              echo "Replacing it with a fresh clone."
              retry_clone
            fi
          else
            echo "No usable cached Git checkout found; cloning fresh."
            retry_clone
          fi

          if ! valid_kernel_tree; then
            echo "Kernel tree failed validation; replacing it with a fresh clone."
            retry_clone
          fi

          if ! valid_kernel_tree; then
            echo "ERROR: Fresh kernel checkout failed validation."
            exit 1
          fi

          cd kernel

          echo "=== Repository ==="
          git remote -v
          actual_remote="$(git remote get-url origin)"
          if [[ "$actual_remote" != "$KERNEL_REPO_URL" && "$actual_remote" != "${KERNEL_REPO_URL}.git" ]]; then
            echo "ERROR: Unexpected kernel repository URL: $actual_remote"
            exit 1
          fi

          echo "=== Branch and commit ==="
          actual_branch="$(git branch --show-current)"
          echo "Expected branch: $KERNEL_REF"
          echo "Checked-out branch: $actual_branch"
          echo "Commit: $(git rev-parse HEAD)"

          if [[ "$actual_branch" != "$KERNEL_REF" ]]; then
            echo "ERROR: Checked-out branch does not match KERNEL_REF."
            exit 1
          fi

          echo "=== Kernel Makefile version ==="
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' Makefile
          grep -qE '^VERSION[[:space:]]*=[[:space:]]*5([[:space:]]|$)' Makefile
          grep -qE '^PATCHLEVEL[[:space:]]*=[[:space:]]*10([[:space:]]|$)' Makefile

          echo "=== Required ARM64 source files ==="
          test -f arch/arm64/Makefile
          test -f arch/arm64/boot/Makefile
          ls -l arch/arm64/Makefile arch/arm64/boot/Makefile

          echo "=== AOSP source layout (top two levels) ==="
          find . -maxdepth 2 -type d -not -path './.git*' | sort | sed -n '1,100p'

          echo "=== ARM64 source layout ==="
          find arch/arm64 -maxdepth 2 -type f | sort | sed -n '1,100p'

          echo "Kernel branch, version, and source-layout validation passed."

      - name: Integrate KernelSU-Next + SUSFS patches
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          echo "=== Install KernelSU-Next ==="
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          cd ..

          echo "=== Resolve SUSFS branch to exact commit SHA ==="
          SUSFS_BRANCH="gki-android12-5.10"
          git clone --no-checkout https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git -C susfs4ksu fetch --depth=1 origin "$SUSFS_BRANCH"
          SUSFS_SHA="$(git -C susfs4ksu rev-parse FETCH_HEAD)"
          echo "Using SUSFS commit: $SUSFS_SHA"
          git -C susfs4ksu checkout --detach "$SUSFS_SHA"

          echo "=== Copy SUSFS files ==="
          cp susfs4ksu/kernel_patches/fs/* kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel/include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch kernel/

          echo "=== Apply SUSFS patch ==="
          cd kernel
          patch -p1 --forward --batch --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

          echo "=== Strict compatibility validation ==="
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("fs/statfs.c")
          if not path.exists():
              raise SystemExit(f"{path}: missing after SUSFS patch!")

          source = path.read_text(encoding="utf-8")

          if not re.search(r"\bint\s+vfs_statfs\s*\([^)]*\)\s*\{", source):
              raise SystemExit(f"{path}: missing vfs_statfs() implementation after patch")

          if not re.search(
              r"dentry\s*->\s*d_sb\s*->\s*s_op\s*->\s*statfs\s*\(\s*dentry\s*,\s*buf\s*\)",
              source,
          ):
              raise SystemExit(
                  f"{path}: missing expected statfs call pattern: dentry->d_sb->s_op->statfs(dentry, buf)"
              )

          code = re.sub(
              r'/\*.*?\*/|//[^\n]*|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'',
              lambda m: re.sub(r'[^\n]', ' ', m.group(0)),
              source,
              flags=re.DOTALL,
          )

          depth = 0
          for lineno, line in enumerate(code.splitlines(), start=1):
              for ch in line:
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"{path}:{lineno}: unexpected closing brace")

          if depth != 0:
              raise SystemExit(f"{path}: unbalanced braces (final depth {depth})")

          func_match = re.search(r"\bint\s+vfs_statfs\s*\([^)]*\)\s*\{", code)
          if not func_match:
              raise SystemExit(f"{path}: could not locate vfs_statfs() function block")

          open_brace = code.find("{", func_match.start(), func_match.end())
          func_depth = 1
          close_idx = None
          for idx in range(open_brace + 1, len(code)):
              if code[idx] == "{":
                  func_depth += 1
              elif code[idx] == "}":
                  func_depth -= 1
                  if func_depth == 0:
                      close_idx = idx
                      break

          if close_idx is None:
              raise SystemExit(f"{path}: vfs_statfs() block has no matching closing brace")

          call_pattern = re.compile(
              r"dentry\s*->\s*d_sb\s*->\s*s_op\s*->\s*statfs\s*\(\s*dentry\s*,\s*buf\s*\)"
          )
          for match in call_pattern.finditer(code):
              if not (func_match.start() < match.start() < close_idx):
                  raise SystemExit(f"{path}: statfs call is outside the vfs_statfs() function body")

          print(f"{path}: strict compatibility validation passed")
          PY

          echo "=== Patch validation complete ==="

      - name: Configure Kernel, Localversion & SUSFS
        working-directory: kernel
        run: |
          set -euxo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"

          echo "=== Configuring kernel ==="
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          ./scripts/config --set-str CONFIG_LOCALVERSION "${{ github.event.inputs.localversion }}"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO

          ./scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
          ./scripts/config --disable CONFIG_UAPI_HEADER_TEST
          ./scripts/config --disable CONFIG_WERROR

          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --disable CONFIG_KSU_KPROBES_HOOK
          ./scripts/config --enable CONFIG_KSU_SUSFS
          ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ./scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_SU

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Image
        working-directory: kernel
        run: |
          set -euxo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ github.event.inputs.build_user }}"
          export KBUILD_BUILD_HOST="${{ github.event.inputs.build_host }}"

          if ! make -j"$(nproc --all)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc HOSTCXX=g++ KCFLAGS="-Wno-error" Image 2>&1 | tee build.log; then
            echo "=== COMPILER ERRORS SUMMARY ==="
            grep -n -C 3 -E "error:|fatal error:|undefined reference|implicit declaration" build.log || tail -n 50 build.log
            exit 1
          fi

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Hiruko-puppetmaster-5.10.272-SUSFS/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/is_slot_device=auto;\nblock=boot;/g' anykernel.sh
          rm -rf .git
          zip -r9 ../Hiruko-puppetmaster-5.10.272-SUSFS.zip ./*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v5.10.272-susfs-${{ github.run_number }}
          name: Hiruko-puppetmaster-5.10.272 SUSFS (Build #${{ github.run_number }})
          body: |
            ### Custom GKI Kernel Build with SUSFS
            * **Kernel Version:** `5.10.272${{ github.event.inputs.localversion }}`
            * **Build Signature:** `${{ github.event.inputs.build_user }}@${{ github.event.inputs.build_host }}`
            * **Root & Hiding:** KernelSU-Next (`dev-susfs`) + SUSFS (`gki-android12-5.10`)
            * **Target Architecture:** ARM64 Android 12 GKI (`android12-5.10-lts`)
          files: |
            Hiruko-puppetmaster-5.10.272-SUSFS.zip
            kernel/arch/arm64/boot/Image
